name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Trivy
      run: |
        wget https://github.com/aquasecurity/trivy/releases/download/v0.55.0/trivy_0.55.0_Linux-64bit.deb
        sudo dpkg -i trivy_0.55.0_Linux-64bit.deb

    - name: Build Docker image
      run: docker build -t trivy-test:${{ github.sha }} .

    - name: Scan container image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'trivy-test:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Scan Kubernetes manifests
      run: |
        trivy config --severity CRITICAL,HIGH --exit-code 1 k8s/